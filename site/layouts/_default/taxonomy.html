{{ define "main" }}

{{ partial "jumbotron" (dict "imageUrl" "/img/teach.webp" "title" "All Tags") }}

<div class="mw7 center">
    <ul class="pa3">
        {{ range .Data.Pages }}
        <div class="flex">
            <a href="{{ .RelPermalink }}" class="no-underline pa3 bg-grey-1 br1 mb2 db raise w-100">
                <h3 class="f3 b lh-title mb1 primary">{{ .Title }}</h3>
                <p class="link b dib black mb0">View posts →</p>
            </a>
        </div>
        {{ end }}
    </ul>
    {{ partial "pagination" . }}
</div>

{{end}}
