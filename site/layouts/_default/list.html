{{ define "main" }}

{{ partial "jumbotron" (dict "imageUrl" "/img/typewriter.webp" "title" "Latest Posts" "subtitle" "View my latest blog posts.") }}

<div class="mw7 center pt4">
  <ul class="pa3">
    {{ range (.Paginator 5).Pages.ByPublishDate.Reverse }}
    <div class="flex">
      {{ .Render "li"}}
    </div>
    {{ end }}
  </ul>
  {{ partial "pagination" . }}
</div>

{{end}}
