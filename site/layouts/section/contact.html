{{ define "main" }}

<div class="ph3">
	<div class="center mw6 pv3">

		<img src="{{ .Params.logo }}" alt="" class="db w6 center pv4">

		{{ .Content }}

		<div class="mb3">
			<div>
				<h3 class="f3 b lh-title primary">Newsletter</h3>
				<p>If you are interested in what I do, you can sign up for my free newsletter below:</p>
				{{ partial "newsletter-form" . }}
			</div>
		</div>

		<div class="mb3">
			<div>
				<h3 class="f3 b lh-title primary">Links</h3>
				<p>You can find my current social media profiles on the <a href="https://link.neoski.uk">links page</a>.</p>
			</div>
		</div>

		<div class="mb3">
			<div>
				<h3 class="f3 b lh-title primary">Drop Me a Line</h3>
				{{ partial "contact-form" . }}
			</div>
		</div>

	</div>
</div>

{{ end }}
