<div class="pv4">
	<div class="ph3 mw7 center">
		<h2 class="f2 b lh-title mb2">{{.heading}}</h2>
		<p class="mb4">{{.description}}</p>

		<div class="mb3">
			{{ range .blurbs }}
			<div class="mb4">
				<h3 class="f3 b lh-title mb2 primary">{{ .subheading }}</h3>
				<p>{{ .text }}</p>
				<p>{{ .more1 }}</p>
				<p>{{ .more2 }}</p>
				<img src="{{ .image }}" alt="" class="center db mb3">
			</div>
			{{ end }}
		</div>
	</div>
</div>
