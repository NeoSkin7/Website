<div class="pv4">
	<div class="ph3 mw7 center">

		<h2 class="f2 b lh-title mb3">Latest Stuff</h2>

		<div class="w-100 mb3">
			{{ range first 5 (where .Site.RegularPages "Type" "post") }}
			<div class="flex">
				{{ .Render "li" }}
			</div>
			{{ end }}
		</div>

		<div class="tc">
			<a href="/post" class="btn raise" aria-label="View more blog posts">View All Posts</a>
		</div>

	</div>
</div>
