{{ define "main" }}

{{ partial "jumbotron" (dict "imageUrl" .Params.image "title" .Params.title "subtitle" .Params.subtitle) }}

<div class="mw7 center pt4">
    <ul class="pa3">
        {{ range (.Paginator 5).Pages.ByTitle }}
        <div class="flex">
            {{ .Render "li"}}
        </div>
        {{ end }}
    </ul>
    {{ partial "pagination" . }}
</div>

{{end}}
